<html>
<head>
<title> Html Style </title>

<style> 

body {

margin: 0;
padding: 0;
min-height: 100vh;
background: linear-gradient(to bottom, pink 30%, lightblue 30% );
position: relative;

}

hr {

border: none;
height: 4px;
background-color: #2c3e50;
margin: 0;
position: absolute;
top: 30%;
width: 100%;


}

.h1c {

color:white;
text-align: center;

}

.ps {

font-family: Cursive;
font-size: 25px;
color: red;


}

</style>



</head>
<body>

<h1> There is no inline style for h1 </h1>
<p style="color:red; font-family:Verdana">This element on the page will be affected by inline CSS style in color and font type </p>
<p style="text-align:center; font-size:30pt"> The font size and text align will affected in this paragraph </p>

<hr>




<h1 class="h1c"> This is a test for internal css style using h1 </h1>
<h2> This is a test for internal css style using h2 </h2>

<p class="ps"> This is a paragraph </p>



</body>
</html>
